<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Carrito y Envío</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body class="container py-4">
    <h2 class="mb-4">Tu Carrito y Envío</h2>

    <div class="row g-4">
      <!-- Tabla del Carrito -->
      <div class="col-md-6">
        <div class="card p-3 shadow-sm">
          <h5>Libros seleccionados</h5>
          <table class="table mt-2">
            <thead class="table-dark">
              <tr>
                <th>Libro</th>
                <th>Precio</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>JavaScript Fácil</td>
                <td>20,00 €</td>
              </tr>
              <tr>
                <td>Diseño con Bootstrap</td>
                <td>15,00 €</td>
              </tr>
            </tbody>
          </table>
          <h5 class="text-end text-success">Total: 35,00 €</h5>
        </div>
      </div>

      <!-- Formulario Detalles de Envío -->
      <div class="col-md-6">
        <div class="card p-3 shadow-sm">
          <h5>Detalles de Envío</h5>
          <form action="factura.html" method="GET">
            <input
              type="text"
              name="nombre"
              class="form-control mb-2"
              placeholder="Tu nombre"
              required
            />
            <input
              type="text"
              name="direccion"
              class="form-control mb-3"
              placeholder="Tu dirección de envío"
              required
            />
            <button type="submit" class="btn btn-success w-100">
              Comprar y Ver Factura
            </button>
          </form>
        </div>
      </div>
    </div>

    <a href="index.html" class="btn btn-link mt-3">← Volver a la tienda</a>
  </body>
</html>
