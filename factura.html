<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Factura</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="container py-5">
    <div class="card p-4 shadow mx-auto" style="max-width: 500px">
      <h3 class="text-primary">Factura #001</h3>
      <hr />
      <!-- Datos recibidos del formulario -->
      <p><strong>Cliente:</strong> <span id="cliente"></span></p>
      <p><strong>Envío a:</strong> <span id="envio"></span></p>
      <hr />
      <p>1x JavaScript Fácil — 20,00 €</p>
      <p>1x Diseño con Bootstrap — 15,00 €</p>
      <h4 class="text-success mt-3">Total Pagado: 35,00 €</h4>

      <div class="mt-4 text-center">
        <a href="index.html" class="btn btn-secondary">Inicio</a>
        <button onclick="window.print()" class="btn btn-primary">
          Imprimir
        </button>
      </div>
    </div>

    <!-- Recoge el nombre y dirección escritos en el carrito -->
    <script>
      const datos = new URLSearchParams(window.location.search);
      document.getElementById("cliente").textContent =
        datos.get("nombre") || "Cliente";
      document.getElementById("envio").textContent =
        datos.get("direccion") || "Dirección no indicada";
    </script>
  </body>
</html>
